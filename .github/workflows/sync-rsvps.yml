name: Sync RSVPs from Zola to Aisle Planner

on:
  schedule:
    # Runs daily at 4am UTC (12am ET). Adjust the cron expression as needed:
    # https://crontab.guru is handy for building these.
    - cron: "0 4 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  sync-rsvps:
    runs-on: ubuntu-latest
    # Hard ceiling so a genuine hang fails loudly after 15 minutes instead
    # of silently running (and burning Actions minutes) for hours.
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run RSVP sync
        env:
          ZOLA_EMAIL: ${{ secrets.ZOLA_EMAIL }}
          ZOLA_PASSWORD: ${{ secrets.ZOLA_PASSWORD }}
          AISLEPLANNER_EMAIL: ${{ secrets.AISLEPLANNER_EMAIL }}
          AISLEPLANNER_PASSWORD: ${{ secrets.AISLEPLANNER_PASSWORD }}
          PYTHONUNBUFFERED: "1"  # forces print() to show up live in the log instead of being buffered
        # xvfb-run starts a virtual display and runs the script against
        # it, so Chromium launches with headless=False but there's no
        # physical screen involved -- required since the script now
        # expects a real display to render to.
        run: xvfb-run --auto-servernum python -u update_rsvp_statuses.py

      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore