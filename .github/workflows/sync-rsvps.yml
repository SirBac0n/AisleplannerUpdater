name: Sync RSVPs from Zola to Aisle Planner

on:
  schedule:
    # Runs daily at 4am UTC (12am EDT). Adjust the cron expression as needed:
    # https://crontab.guru is handy for building these.
    - cron: "0 4 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  sync-rsvps:
    runs-on: ubuntu-latest
    # Hard ceiling so a genuine hang fails loudly after 15 minutes instead
    # of silently running (and burning Actions minutes) for hours.
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv
          playwright install chromium

      - name: Restore saved Zola session
        # zola_auth_state.json (produced once, by hand, via
        # save_zola_session.py) contains the cookies from an
        # already-verified login. Storing it base64-encoded in a secret
        # and decoding it here means this workflow never touches Zola's
        # login form, so it never triggers the email verification
        # challenge.
        env:
          ZOLA_AUTH_STATE_B64: ${{ secrets.ZOLA_AUTH_STATE_B64 }}
        run: echo "$ZOLA_AUTH_STATE_B64" | base64 -d > zola_auth_state.json

      - name: Run RSVP sync
        env:
          AISLEPLANNER_EMAIL: ${{ secrets.AISLEPLANNER_EMAIL }}
          AISLEPLANNER_PASSWORD: ${{ secrets.AISLEPLANNER_PASSWORD }}
          PYTHONUNBUFFERED: "1"  # forces print() to show up live in the log instead of being buffered
        run: python -u update_rsvp_statuses.py

      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore